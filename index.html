<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Task Tracker</title>

  <!-- ========================================================
        Telegram Mini Apps SDK
        ======================================================== -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- ========================================================
        SheetJS — экспорт задач в Excel
        ======================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --tg-theme-bg-color: #13151A;
      --tg-theme-text-color: #FFFFFF;
      --tg-theme-hint-color: #8E94A0;
      --tg-theme-button-color: #3F78FF;
      --tg-theme-button-text-color: #FFFFFF;
      --tg-theme-secondary-bg-color: #1B1D24;
      --tg-theme-accent-color: #2EC4B6;
      --border-color: #262933;
      --border-subtle: #1F2128;
      --radius-sm: 8px;
      --radius-md: 10px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
    }

    /* Reset default button/input styles to remove bevel */
    button, input, select, textarea {
      box-shadow: none;
    }

    button:not(.view-switcher button):not(.segmented-control button):not(.btn-primary):not(.btn-secondary):not(.modal-close) {
      border: none;
      background: none;
      padding: 0;
      margin: 0;
    }

    input, select, textarea {
      border: 1px solid var(--border-color);
      box-shadow: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--tg-theme-button-color);
      box-shadow: none;
      outline: none;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0A0B0E;
      color: var(--tg-theme-text-color);
      margin: 0;
      padding: 12px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    body.modal-open {
      overflow: hidden;
    }

    header {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-primary {
      background-color: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      height: 32px;
      border: 1px solid var(--border-color);
    }

    .btn-primary svg {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
    }

    .btn-secondary {
      background-color: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-hint-color);
      padding: 0;
      border-radius: 8px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      font-size: 13px;
      height: 32px;
      width: 32px;
      flex-shrink: 0;
      box-sizing: border-box;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      border-color: var(--tg-theme-hint-color);
    }

    .view-switcher {
      display: flex;
      padding: 2px;
      align-items: flex-start;
      border-radius: 8px;
      background: var(--tg-theme-bg-color);
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .view-switcher button {
      padding: 6px 8px;
      border-radius: 6px;
      background: transparent;
      color: var(--tg-theme-hint-color);
      font-weight: 600;
      font-size: 13px;
      border: none;
      box-shadow: none;
      height: 32px;
      display: flex;
      align-items: center;
      white-space: nowrap;
      flex-shrink: 1;
      min-width: 0;
    }

    @media (max-width: 380px) {
      .view-switcher button {
        padding: 6px 4px;
        font-size: 12px;
      }
    }

    .view-switcher button.is-active {
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
    }

    .header-buttons {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      align-items: center;
    }

    #excel-export-btn .excel-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      transition: transform 0.3s ease;
    }

    #excel-export-btn.excel-syncing .excel-icon {
      animation: spin 1s linear infinite;
    }

    #excel-export-btn .excel-text {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #excel-export-btn .sync-indicator {
      display: none;
    }

    #task-filter-executor {
      width: 100%;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      font: inherit;
      border: 1px solid var(--border-color);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      height: 32px;
      box-sizing: border-box;
    }

    #task-filter-executor:focus {
      border-color: var(--tg-theme-button-color);
      outline: none;
    }

    @media (max-width: 360px) {
      #task-filter-executor {
        min-width: 120px;
      }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .board {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .board.hidden {
      display: none;
    }

    /* Список скрыт по умолчанию, показывается только с .active */
    #list-view {
      display: none !important;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      background-color: #0A0B0E;
      border-radius: var(--radius-md);
      padding: 12px;
      border: 1px solid var(--border-color);
    }

    #list-view.active {
      display: flex !important;
    }

    @media (min-width: 600px) {
      .board {
        flex-direction: row;
        gap: 8px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 8px;
      }

      .board::-webkit-scrollbar {
        height: 6px;
      }

      .board::-webkit-scrollbar-track {
        background: var(--tg-theme-secondary-bg-color);
        border-radius: 3px;
      }

      .board::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 3px;
      }

      .board::-webkit-scrollbar-thumb:hover {
        background: var(--tg-theme-hint-color);
      }

      .column {
        flex: 0 0 280px;
        min-width: 280px;
        max-width: 280px;
        min-height: 100px;
      }
    }

    /* Вертикальная раскладка - колонки на всю ширину */
    @media (max-width: 599px) {
      .board {
        flex-direction: column;
        gap: 12px;
      }

      .column {
        flex: none;
        width: 100%;
        min-width: 0;
        min-height: 50px;
      }
    }

    #list-view .task-card {
      width: 100%;
    }

    .list-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: var(--tg-theme-hint-color);
      text-align: center;
      gap: 8px;
    }

    .list-empty-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--tg-theme-secondary-bg-color);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .list-empty-icon svg {
      width: 24px;
      height: 24px;
      stroke: var(--tg-theme-hint-color);
    }

    .list-empty-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--tg-theme-text-color);
      margin-bottom: 2px;
    }

    .list-empty-subtext {
      font-size: 13px;
      color: var(--tg-theme-hint-color);
    }

    .column {
      background-color: #13151A;
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 50px;
      border: 1px solid var(--border-color);
    }

    .column-header {
      display: flex;
      padding-bottom: 8px;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .column-header-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .column-header-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .column[data-status="todo"] .column-header-dot {
      background: #3F78FF;
    }

    .column[data-status="progress"] .column-header-dot {
      background: #FF9F2D;
    }

    .column[data-status="done"] .column-header-dot {
      background: #2EC4B6;
    }

    .column[data-status="blocked"] .column-header-dot {
      background: #FF4D4D;
    }

    .column[data-status="cancelled"] .column-header-dot {
      background: var(--tg-theme-hint-color);
    }

    .column-title {
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.01em;
    }

    .column[data-status="todo"] .column-title {
      color: #3F78FF;
    }

    .column[data-status="progress"] .column-title {
      color: #FF9F2D;
    }

    .column[data-status="done"] .column-title {
      color: #2EC4B6;
    }

    .column[data-status="blocked"] .column-title {
      color: #FF4D4D;
    }

    .column[data-status="cancelled"] .column-title {
      color: var(--tg-theme-hint-color);
    }

    .column-count {
      display: flex;
      padding: 2px 6px;
      align-items: flex-start;
      border-radius: 4px;
    }

    .column-count span {
      color: var(--tg-theme-hint-color);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      line-height: 12px;
    }

    .task-list {
      min-height: 40px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-card {
      display: flex;
      align-items: flex-start;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--tg-theme-secondary-bg-color);
      overflow: hidden;
      cursor: grab;
      position: relative;
    }

    .task-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
    }

    .task-card.priority-low::before {
      background: #2EC4B6;
    }

    .task-card.priority-medium::before {
      background: #3F78FF;
    }

    .task-card.priority-high::before {
      background: #FF9F2D;
    }

    .task-card.priority-critical::before {
      background: #FF4D4D;
    }

    .task-card:active {
      cursor: grabbing;
    }

    .task-status-bar {
      width: 3px;
      align-self: stretch;
      flex-shrink: 0;
    }

    .column[data-status="todo"] .task-status-bar {
      background: #3F78FF;
    }

    .column[data-status="progress"] .task-status-bar {
      background: #FF9F2D;
    }

    .column[data-status="done"] .task-status-bar {
      background: #2EC4B6;
    }

    .column[data-status="blocked"] .task-status-bar {
      background: #FF4D4D;
    }

    .column[data-status="cancelled"] .task-status-bar {
      background: var(--tg-theme-hint-color);
    }

    .task-card-content {
      display: flex;
      padding: 12px;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      align-self: stretch;
      position: relative;
    }

    .task-number {
      color: var(--tg-theme-text-color);
      font-size: 14px;
      font-weight: 700;
      padding-right: 80px;
    }

    .task-actions {
      display: flex;
      gap: 2px;
      align-items: center;
      position: absolute;
      top: 2px;
      right: 2px;
    }

    .task-edit {
      background: transparent;
      color: var(--tg-theme-button-color);
      font-size: 14px;
      line-height: 1;
      padding: 4px;
      flex-shrink: 0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border: none;
    }

    .task-edit svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      display: block;
      overflow: visible;
    }

    .task-edit:hover {
      background: rgba(63, 120, 255, 0.15);
    }

    .task-delete {
      background: transparent;
      color: #565D68;
      font-size: 14px;
      line-height: 1;
      padding: 4px;
      flex-shrink: 0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      position: relative;
    }

    .task-delete svg {
      width: 14px;
      height: 14px;
      stroke: #B85252;
      stroke-width: 1;
      flex-shrink: 0;
      display: block;
      overflow: visible;
    }

    .task-delete:hover {
      background: rgba(142, 148, 160, 0.15);
    }

    /* Модальное окно просмотра задачи */
    .task-view-overlay {
      position: fixed;
      inset: 0;
      z-index: 1100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .task-view-overlay.is-open {
      display: flex;
    }

    .task-view-card {
      width: 100%;
      max-width: 560px;
      max-height: 85vh;
      background: var(--tg-theme-bg-color);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      animation: scale-in 0.2s ease-out;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @keyframes scale-in {
      from {
        transform: scale(0.95);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .task-view-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .task-view-text {
      flex: 1;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.5;
      color: var(--tg-theme-text-color);
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
    }

    .task-view-close {
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-hint-color);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.4rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid var(--border-color);
    }

    .task-view-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .task-view-meta {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-view-meta-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .task-view-meta-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--tg-theme-hint-color);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .task-view-meta-value {
      font-size: 14px;
      color: var(--tg-theme-text-color);
      font-weight: 500;
    }

    .task-view-notes {
      margin-top: 8px;
      padding: 12px;
      background: var(--tg-theme-secondary-bg-color);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
    }

    .task-view-notes-text {
      font-size: 14px;
      line-height: 1.6;
      color: var(--tg-theme-text-color);
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
    }

    .task-view-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
    }

    .task-view-footer .btn-secondary,
    .task-view-footer .btn-primary {
      flex: 1;
      text-align: center;
      justify-content: center;
    }

    .task-view-footer .btn-secondary {
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-hint-color);
    }

    .task-view-footer .btn-secondary:hover {
      border-color: var(--tg-theme-hint-color);
    }

    .task-view-status-badge,
    .task-view-priority-badge {
      display: inline-flex;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .task-view-status-badge.status-todo {
      background: rgba(63, 120, 255, 0.15);
      color: #3F78FF;
    }

    .task-view-status-badge.status-progress {
      background: rgba(255, 159, 45, 0.15);
      color: #FF9F2D;
    }

    .task-view-status-badge.status-done {
      background: rgba(46, 196, 182, 0.15);
      color: #2EC4B6;
    }

    .task-view-status-badge.status-blocked {
      background: rgba(255, 77, 77, 0.15);
      color: #FF4D4D;
    }

    .task-view-status-badge.status-cancelled {
      background: rgba(142, 148, 160, 0.15);
      color: var(--tg-theme-hint-color);
    }

    .task-view-priority-badge.priority-low {
      background: rgba(46, 196, 182, 0.15);
      color: #2EC4B6;
    }

    .task-view-priority-badge.priority-medium {
      background: rgba(63, 120, 255, 0.15);
      color: #3F78FF;
    }

    .task-view-priority-badge.priority-high {
      background: rgba(255, 159, 45, 0.15);
      color: #FF9F2D;
    }

    .task-view-priority-badge.priority-critical {
      background: rgba(255, 77, 77, 0.15);
      color: #FF4D4D;
    }

    .task-meta-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      align-self: stretch;
    }

    .task-meta-row {
      display: flex;
      align-items: flex-start;
      gap: 4px;
      align-self: stretch;
    }

    .task-meta-label {
      color: #565D68;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 500;
      line-height: 14px;
      flex-shrink: 0;
    }

    .task-meta-value {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
      flex: 1 0 0;
      overflow: hidden;
      color: var(--tg-theme-hint-color);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 500;
      line-height: 14px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    .modal-overlay.is-open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 520px;
      max-height: min(92vh, 780px);
      display: flex;
      flex-direction: column;
      background: var(--tg-theme-bg-color);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      box-shadow: var(--shadow-lg);
      animation: sheet-up 0.22s ease-out;
    }

    @keyframes sheet-up {
      from {
        transform: translateY(24px);
        opacity: 0.6;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @media (min-width: 520px) {
      .modal-overlay {
        align-items: center;
        padding: 16px;
      }

      .modal-sheet {
        border-radius: var(--radius-lg);
        max-height: min(88vh, 780px);
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 0;
      flex-shrink: 0;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .modal-close {
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-hint-color);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.4rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid var(--border-color);
    }

    .modal-body {
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0));
      flex-shrink: 0;
    }

    .modal-footer .btn-secondary,
    .modal-footer .btn-primary {
      flex: 1;
      text-align: center;
      justify-content: center;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--tg-theme-hint-color);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .field-group input,
    .field-group select,
    .field-group textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      font: inherit;
      border: 1px solid var(--border-color);
    }

    .field-group select {
      cursor: pointer;
    }

    .field-group textarea {
      min-height: 120px;
      max-height: 280px;
      resize: vertical;
      line-height: 1.5;
    }

    #form-notes {
      min-height: 80px;
      max-height: 200px;
    }

    .field-group input:focus,
    .field-group select:focus,
    .field-group textarea:focus {
      outline: none;
      border-color: var(--tg-theme-button-color);
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 400px) {
      .field-row {
        grid-template-columns: 1fr;
      }
    }

    .segmented-control {
      display: inline-flex;
      padding: 2px;
      border-radius: 8px;
      background: var(--tg-theme-bg-color);
      border: 1px solid var(--border-color);
      gap: 2px;
      align-self: flex-start;
    }

    .segmented-control button {
      padding: 6px 8px;
      border-radius: 6px;
      background: transparent;
      color: var(--tg-theme-hint-color);
      font-weight: 600;
      font-size: 13px;
      border: none;
      box-shadow: none;
      height: 32px;
      display: flex;
      align-items: center;
      white-space: nowrap;
      flex-shrink: 1;
      min-width: 0;
    }

    .segmented-control button.is-active {
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
    }

    .deadline-field[hidden] {
      display: none;
    }

    .devtools {
      margin-top: 20px;
      background-color: var(--tg-theme-bg-color);
      border-radius: var(--radius-md);
      padding: 12px;
      border: 1px solid var(--border-color);
    }

    .devtools summary {
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .devtools-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }

    .devtools-note {
      color: var(--tg-theme-hint-color);
      font-size: 0.85rem;
      margin: 0;
      white-space: pre-wrap;
    }

    .member-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .member-card {
      background: var(--tg-theme-secondary-bg-color);
      border-radius: var(--radius-sm);
      padding: 10px;
    }

    .member-card input {
      width: 100%;
      padding: 10px 12px;
      margin-top: 6px;
      border-radius: var(--radius-sm);
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      font: inherit;
    }

    .member-card button {
      margin-top: 8px;
    }

    #auth-status-screen {
      display: block;
      text-align: center;
      padding: 50px 20px;
    }

    #auth-status-screen p {
      color: var(--tg-theme-hint-color);
    }

    #app {
      display: none;
    }
  </style>
</head>

<body>

  <!-- ========================================================
       Экран авторизации
       ======================================================== -->

  <div id="auth-status-screen">

    <h2 id="status-title">
      Подключение к Telegram...
    </h2>

    <p id="status-desc">
      Пожалуйста, подождите. Идет проверка учетных данных.
    </p>

  </div>


  <!-- ========================================================
       Основное приложение
       ======================================================== -->

  <div id="app">

    <header>
      <div class="view-switcher">
        <button
          type="button"
          id="view-board"
          class="is-active"
          onclick="switchView('board')"
        >
          Доска
        </button>
        <button
          type="button"
          id="view-list"
          onclick="switchView('list')"
        >
          Список
        </button>
      </div>
      <div class="field-group" style="position: relative; min-width: 160px;">
        <select id="task-filter-executor" onchange="applyTaskFilter()">
          <option value="">Все</option>
        </select>
      </div>
      <button
        type="button"
        class="btn-primary"
        onclick="openTaskForm()"
      >
        +Задача
      </button>
      <button
        type="button"
        id="excel-export-btn"
        class="btn-secondary"
        onclick="exportToExcel()"
        title="Экспорт в Google Sheets"
      >
        <span class="excel-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/>
          </svg>
        </span>
      </button>
    </header>


    <!-- ======================================================
         Kanban
         ====================================================== -->

    <div class="board">

      <div
        class="column"
        data-status="todo"
        ondragover="allowDrop(event)"
        ondrop="drop(event, 'todo')"
      >
        <div class="column-header">
          <div class="column-header-left">
            <span class="column-header-dot"></span>
            <div class="column-title">Беклог</div>
          </div>
          <div class="column-count"><span class="count-badge">0</span></div>
        </div>
        <div id="todo" class="task-list"></div>
      </div>

      <div
        class="column"
        data-status="progress"
        ondragover="allowDrop(event)"
        ondrop="drop(event, 'progress')"
      >
        <div class="column-header">
          <div class="column-header-left">
            <span class="column-header-dot"></span>
            <div class="column-title">В работе</div>
          </div>
          <div class="column-count"><span class="count-badge">0</span></div>
        </div>
        <div id="progress" class="task-list"></div>
      </div>

      <div
        class="column"
        data-status="done"
        ondragover="allowDrop(event)"
        ondrop="drop(event, 'done')"
      >
        <div class="column-header">
          <div class="column-header-left">
            <span class="column-header-dot"></span>
            <div class="column-title">Выполнено</div>
          </div>
          <div class="column-count"><span class="count-badge">0</span></div>
        </div>
        <div id="done" class="task-list"></div>
      </div>

      <div
        class="column"
        data-status="blocked"
        ondragover="allowDrop(event)"
        ondrop="drop(event, 'blocked')"
      >
        <div class="column-header">
          <div class="column-header-left">
            <span class="column-header-dot"></span>
            <div class="column-title">Блок</div>
          </div>
          <div class="column-count"><span class="count-badge">0</span></div>
        </div>
        <div id="blocked" class="task-list"></div>
      </div>

      <div
        class="column"
        data-status="cancelled"
        ondragover="allowDrop(event)"
        ondrop="drop(event, 'cancelled')"
      >
        <div class="column-header">
          <div class="column-header-left">
            <span class="column-header-dot"></span>
            <div class="column-title">Отменено</div>
          </div>
          <div class="column-count"><span class="count-badge">0</span></div>
        </div>
        <div id="cancelled" class="task-list"></div>
      </div>

    </div>

    <!-- ======================================================
         Список (альтернативный вид)
         ====================================================== -->

    <div id="list-view"></div>

    <details
      id="devtools"
      class="devtools"
      hidden
    >
      <summary>DevTools · справочник команды</summary>

      <div class="devtools-content">
        <p class="devtools-note">
          Приглашение действует 24 часа и добавляет данные коллеги после команды /start.
        </p>

        <button
          type="button"
          class="btn-primary"
          onclick="createInvite()"
        >
          Создать приглашение
        </button>

        <p
          id="invite-output"
          class="devtools-note"
        ></p>

        <div
          id="team-members"
          class="member-list"
        ></div>
      </div>
    </details>

    <!-- ======================================================
         Модальное окно создания задачи
         ====================================================== -->

    <div
      id="task-form-overlay"
      class="modal-overlay"
      aria-hidden="true"
      onclick="handleOverlayClick(event)"
    >
      <div
        class="modal-sheet"
        role="dialog"
        aria-labelledby="modal-title"
        aria-modal="true"
      >
        <div class="modal-header">
          <h3 id="modal-title">Новая задача</h3>
          <button
            type="button"
            class="modal-close"
            aria-label="Закрыть"
            onclick="closeTaskForm()"
          >
            ×
          </button>
        </div>

        <div class="modal-body">
          <div class="field-group">
            <label for="form-text">Текст задачи</label>
            <textarea
              id="form-text"
              placeholder="Опишите задачу — можно в несколько строк"
              maxlength="2000"
              required
            ></textarea>
          </div>

          <div class="field-group">
            <label for="form-executor">Исполнитель</label>
            <select id="form-executor">
              <option value="">— Без исполнителя —</option>
            </select>
          </div>

          <div class="field-row">
            <div class="field-group">
              <label for="form-status">Статус</label>
              <select id="form-status">
                <option value="todo" selected>Беклог</option>
                <option value="progress">В работе</option>
                <option value="blocked">Блок</option>
                <option value="done">Выполнено</option>
                <option value="cancelled">Отменено</option>
              </select>
            </div>

          <div class="field-group">
            <label for="form-priority">Приоритет</label>
            <select id="form-priority">
              <option value="low">Низкий</option>
              <option value="medium" selected>Средний</option>
              <option value="high">Высокий</option>
              <option value="critical">Критический</option>
            </select>
          </div>
        </div>

        <div class="field-group">
          <label for="form-notes">Заметки</label>
          <textarea
            id="form-notes"
            placeholder="Комментарии к задаче (необязательно)"
            maxlength="5000"
          ></textarea>
        </div>

        <div class="field-group">
          <label>Срок</label>
            <div
              class="segmented-control"
              role="tablist"
              aria-label="Тип срока"
            >
              <button
                type="button"
                id="deadline-mode-date"
                class="is-active"
                role="tab"
                aria-selected="true"
                onclick="setDeadlineMode('date')"
              >
                Дата
              </button>
              <button
                type="button"
                id="deadline-mode-sprint"
                role="tab"
                aria-selected="false"
                onclick="setDeadlineMode('sprint')"
              >
                Спринт
              </button>
            </div>
            <input
              type="date"
              id="form-deadline-date"
              class="deadline-field"
            >
            <input
              type="text"
              id="form-deadline-sprint"
              class="deadline-field"
              hidden
              maxlength="80"
              placeholder="Например: Спринт 24 или Q3"
            >
          </div>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn-secondary"
            onclick="closeTaskForm()"
          >
            Отмена
          </button>
          <button
            type="button"
            class="btn-primary"
            onclick="saveTask()"
          >
            Сохранить
          </button>
        </div>
    </div>

  </div>

  <!-- ======================================================
       Модальное окно просмотра задачи
       ====================================================== -->

  <div
    id="task-view-overlay"
    class="task-view-overlay"
    onclick="closeViewTask(event)"
  >
    <div
      class="task-view-card"
      role="dialog"
      aria-modal="true"
    >
      <div class="task-view-header">
        <h3 id="task-view-text" class="task-view-text"></h3>
        <button
          type="button"
          class="task-view-close"
          aria-label="Закрыть"
          onclick="closeViewTask()"
        >
          ×
        </button>
      </div>

      <div class="task-view-body">
        <div class="task-view-meta">
          <div class="task-view-meta-item">
            <span class="task-view-meta-label">Статус</span>
            <span id="task-view-status" class="task-view-status-badge"></span>
          </div>

          <div class="task-view-meta-item">
            <span class="task-view-meta-label">Приоритет</span>
            <span id="task-view-priority" class="task-view-priority-badge"></span>
          </div>

          <div class="task-view-meta-item">
            <span class="task-view-meta-label">Исполнитель</span>
            <span id="task-view-executor" class="task-view-meta-value"></span>
          </div>

          <div class="task-view-meta-item">
            <span class="task-view-meta-label">Срок</span>
            <span id="task-view-deadline" class="task-view-meta-value"></span>
          </div>

          <div class="task-view-meta-item" id="task-view-notes-container" style="display: none;">
            <span class="task-view-meta-label">Заметки</span>
            <div class="task-view-notes">
              <p id="task-view-notes" class="task-view-notes-text"></p>
            </div>
          </div>
        </div>
      </div>

      <div class="task-view-footer">
        <button
          type="button"
          class="btn-secondary"
          onclick="deleteFromView()"
          style="color: #B85252"
        >
          Удалить
        </button>
        <button
          type="button"
          class="btn-primary"
          id="task-view-edit-btn"
          onclick="editFromView()"
        >
          Изменить
        </button>
      </div>
    </div>
  </div>


  <!-- ========================================================
        Pocket Jira JavaScript

        Версия нужна для принудительного обновления файла
        в Telegram WebView после нового deployment.
        ======================================================== -->

  <script src="./script.js?v=20260819-1"></script>

</body>
</html>
