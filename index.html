<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pocket Jira</title>

  <!-- ========================================================
       Telegram Mini Apps SDK
       ======================================================== -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- ========================================================
       SheetJS — экспорт задач в Excel
       ======================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --tg-theme-bg-color: #ffffff;
      --tg-theme-text-color: #000000;
      --tg-theme-hint-color: #707579;
      --tg-theme-button-color: #2481cc;
      --tg-theme-button-text-color: #ffffff;
      --tg-theme-secondary-bg-color: #f4f4f5;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.22);
      --border-subtle: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
      background-color: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-text-color);
      margin: 0;
      padding: 12px 12px 24px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    body.modal-open {
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    button {
      font: inherit;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    button:active {
      opacity: 0.85;
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background-color: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-weight: 600;
    }

    .btn-secondary {
      background-color: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      box-shadow: inset 0 0 0 1px var(--border-subtle);
    }

    .header-buttons {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      align-items: center;
    }

    #excel-export-btn {
      width: 40px;
      height: 40px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #excel-export-btn .excel-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      transition: transform 0.3s ease;
    }

    #excel-export-btn.excel-syncing .excel-icon {
      animation: spin 1s linear infinite;
    }

    #excel-export-btn .excel-text {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .board {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .column {
      background-color: var(--tg-theme-bg-color);
      border-radius: var(--radius-md);
      padding: 12px;
      box-shadow: var(--shadow-sm);
    }

    .column-title {
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--tg-theme-secondary-bg-color);
      letter-spacing: 0.01em;
    }

    .column[data-status="todo"] .column-title {
      color: #2481cc;
      border-bottom-color: rgba(36, 129, 204, 0.25);
    }

    .column[data-status="progress"] .column-title {
      color: #e6a700;
      border-bottom-color: rgba(230, 167, 0, 0.28);
    }

    .column[data-status="done"] .column-title {
      color: #2e9f5b;
      border-bottom-color: rgba(46, 159, 91, 0.28);
    }

    .column[data-status="blocked"] .column-title {
      color: #e53935;
      border-bottom-color: rgba(229, 57, 53, 0.28);
    }

    .column[data-status="cancelled"] .column-title {
      color: var(--tg-theme-hint-color);
      border-bottom-color: var(--border-subtle);
    }

    .task-list {
      min-height: 40px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-card {
      background-color: var(--tg-theme-secondary-bg-color);
      padding: 12px;
      border-radius: var(--radius-sm);
      border-left: 4px solid #b0b0b0;
      cursor: grab;
      box-shadow: var(--shadow-sm);
    }

    .task-card:active {
      cursor: grabbing;
    }

    .task-card.priority-low {
      border-left-color: #4caf50;
    }

    .task-card.priority-medium {
      border-left-color: #ffb300;
    }

    .task-card.priority-high {
      border-left-color: #e53935;
    }

    .task-card.priority-critical {
      border-left-color: #7b1fa2;
    }

    .task-text {
      font-weight: 600;
      font-size: 0.95rem;
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .task-header {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .task-header .task-text {
      flex: 1;
      min-width: 0;
    }

    .task-delete {
      background: transparent;
      color: var(--tg-theme-hint-color);
      font-size: 1.35rem;
      line-height: 1;
      padding: 2px 4px;
      flex-shrink: 0;
      border-radius: 6px;
    }

    .task-delete:hover {
      background: rgba(0, 0, 0, 0.06);
    }

    .task-meta {
      font-size: 0.78rem;
      color: var(--tg-theme-hint-color);
      margin-top: 4px;
    }

    .task-meta:first-of-type {
      margin-top: 0;
    }

    .task-deadline {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.05);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    .modal-overlay.is-open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 520px;
      max-height: min(92vh, 780px);
      display: flex;
      flex-direction: column;
      background: var(--tg-theme-bg-color);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      box-shadow: var(--shadow-lg);
      animation: sheet-up 0.22s ease-out;
    }

    @keyframes sheet-up {
      from {
        transform: translateY(24px);
        opacity: 0.6;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @media (min-width: 520px) {
      .modal-overlay {
        align-items: center;
        padding: 16px;
      }

      .modal-sheet {
        border-radius: var(--radius-lg);
        max-height: min(88vh, 780px);
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 0;
      flex-shrink: 0;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .modal-close {
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-hint-color);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.4rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-body {
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0));
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .modal-footer .btn-secondary,
    .modal-footer .btn-primary {
      flex: 1;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--tg-theme-hint-color);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .field-group input,
    .field-group select,
    .field-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      font: inherit;
    }

    .field-group textarea {
      min-height: 120px;
      max-height: 280px;
      resize: vertical;
      line-height: 1.5;
    }

    #form-notes {
      min-height: 80px;
      max-height: 200px;
    }

    .field-group input:focus,
    .field-group select:focus,
    .field-group textarea:focus {
      outline: none;
      border-color: var(--tg-theme-button-color);
      box-shadow: 0 0 0 3px rgba(36, 129, 204, 0.15);
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 400px) {
      .field-row {
        grid-template-columns: 1fr;
      }
    }

    .segmented-control {
      display: flex;
      padding: 3px;
      border-radius: var(--radius-sm);
      background: var(--tg-theme-secondary-bg-color);
      gap: 3px;
    }

    .segmented-control button {
      flex: 1;
      padding: 8px 10px;
      border-radius: 6px;
      background: transparent;
      color: var(--tg-theme-hint-color);
      font-weight: 600;
      font-size: 0.85rem;
    }

    .segmented-control button.is-active {
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      box-shadow: var(--shadow-sm);
    }

    .deadline-field[hidden] {
      display: none;
    }

    .devtools {
      margin-top: 20px;
      background-color: var(--tg-theme-bg-color);
      border-radius: var(--radius-md);
      padding: 12px;
      box-shadow: var(--shadow-sm);
    }

    .devtools summary {
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .devtools-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }

    .devtools-note {
      color: var(--tg-theme-hint-color);
      font-size: 0.85rem;
      margin: 0;
      white-space: pre-wrap;
    }

    .member-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .member-card {
      background: var(--tg-theme-secondary-bg-color);
      border-radius: var(--radius-sm);
      padding: 10px;
    }

    .member-card input {
      width: 100%;
      padding: 10px 12px;
      margin-top: 6px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      font: inherit;
    }

    .member-card button {
      margin-top: 8px;
    }

    #auth-status-screen {
      display: block;
      text-align: center;
      padding: 50px 20px;
    }

    #auth-status-screen p {
      color: var(--tg-theme-hint-color);
    }

    #app {
      display: none;
    }
  </style>
</head>

<body>

  <!-- ========================================================
       Экран авторизации
       ======================================================== -->

  <div id="auth-status-screen">

    <h2 id="status-title">
      Подключение к Telegram...
    </h2>

    <p id="status-desc">
      Пожалуйста, подождите. Идет проверка учетных данных.
    </p>

  </div>


  <!-- ========================================================
       Основное приложение
       ======================================================== -->

  <div id="app">

    <header>

      <h2 id="user-greeting">
        Загрузка...
      </h2>

      <div class="header-buttons">

        <button
          type="button"
          class="btn-primary"
          onclick="openTaskForm()"
        >
          + Задача
        </button>

        <button
          type="button"
          id="excel-export-btn"
          class="btn-secondary"
          onclick="exportToExcel()"
          title="Экспорт в Google Sheets"
        >
          <span class="excel-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </span>
          <span class="excel-text">Excel</span>
        </button>

      </div>

    </header>


    <!-- ======================================================
         Kanban
         ====================================================== -->

    <div class="board">

      <div
        class="column"
        data-status="todo"
        ondragover="allowDrop(event)"
        ondrop="drop(event, 'todo')"
      >

        <div class="column-title">
          Беклог
        </div>

        <div
          id="todo"
          class="task-list"
        ></div>

      </div>


      <div
        class="column"
        data-status="progress"
        ondragover="allowDrop(event)"
        ondrop="drop(event, 'progress')"
      >

        <div class="column-title">
          В работе
        </div>

        <div
          id="progress"
          class="task-list"
        ></div>

      </div>


      <div
        class="column"
        data-status="done"
        ondragover="allowDrop(event)"
        ondrop="drop(event, 'done')"
      >

        <div class="column-title">
          Выполнено
        </div>

        <div
          id="done"
          class="task-list"
        ></div>

      </div>


      <div
        class="column"
        data-status="blocked"
        ondragover="allowDrop(event)"
        ondrop="drop(event, 'blocked')"
      >

        <div class="column-title">
          Блок
        </div>

        <div
          id="blocked"
          class="task-list"
        ></div>

      </div>


      <div
        class="column"
        data-status="cancelled"
        ondragover="allowDrop(event)"
        ondrop="drop(event, 'cancelled')"
      >

        <div class="column-title">
          Отменено
        </div>

        <div
          id="cancelled"
          class="task-list"
        ></div>

      </div>

    </div>

    <details
      id="devtools"
      class="devtools"
      hidden
    >
      <summary>DevTools · справочник команды</summary>

      <div class="devtools-content">
        <p class="devtools-note">
          Приглашение действует 24 часа и добавляет данные коллеги после команды /start.
        </p>

        <button
          type="button"
          class="btn-primary"
          onclick="createInvite()"
        >
          Создать приглашение
        </button>

        <p
          id="invite-output"
          class="devtools-note"
        ></p>

        <div
          id="team-members"
          class="member-list"
        ></div>
      </div>
    </details>

    <!-- ======================================================
         Модальное окно создания задачи
         ====================================================== -->

    <div
      id="task-form-overlay"
      class="modal-overlay"
      aria-hidden="true"
      onclick="handleOverlayClick(event)"
    >
      <div
        class="modal-sheet"
        role="dialog"
        aria-labelledby="modal-title"
        aria-modal="true"
      >
        <div class="modal-header">
          <h3 id="modal-title">Новая задача</h3>
          <button
            type="button"
            class="modal-close"
            aria-label="Закрыть"
            onclick="closeTaskForm()"
          >
            ×
          </button>
        </div>

        <div class="modal-body">
          <div class="field-group">
            <label for="form-text">Текст задачи</label>
            <textarea
              id="form-text"
              placeholder="Опишите задачу — можно в несколько строк"
              maxlength="2000"
              required
            ></textarea>
          </div>

          <div class="field-group">
            <label for="form-executor">Исполнитель</label>
            <select id="form-executor">
              <option value="">— Без исполнителя —</option>
            </select>
          </div>

          <div class="field-row">
            <div class="field-group">
              <label for="form-status">Статус</label>
              <select id="form-status">
                <option value="todo" selected>Беклог</option>
                <option value="progress">В работе</option>
                <option value="blocked">Блок</option>
                <option value="done">Выполнено</option>
                <option value="cancelled">Отменено</option>
              </select>
            </div>

          <div class="field-group">
            <label for="form-priority">Приоритет</label>
            <select id="form-priority">
              <option value="low">Низкий</option>
              <option value="medium" selected>Средний</option>
              <option value="high">Высокий</option>
              <option value="critical">Критический</option>
            </select>
          </div>
        </div>

        <div class="field-group">
          <label for="form-notes">Заметки</label>
          <textarea
            id="form-notes"
            placeholder="Комментарии к задаче (необязательно)"
            maxlength="5000"
          ></textarea>
        </div>

        <div class="field-group">
          <label>Срок</label>
            <div
              class="segmented-control"
              role="tablist"
              aria-label="Тип срока"
            >
              <button
                type="button"
                id="deadline-mode-date"
                class="is-active"
                role="tab"
                aria-selected="true"
                onclick="setDeadlineMode('date')"
              >
                Дата
              </button>
              <button
                type="button"
                id="deadline-mode-sprint"
                role="tab"
                aria-selected="false"
                onclick="setDeadlineMode('sprint')"
              >
                Спринт
              </button>
            </div>
            <input
              type="date"
              id="form-deadline-date"
              class="deadline-field"
            >
            <input
              type="text"
              id="form-deadline-sprint"
              class="deadline-field"
              hidden
              maxlength="80"
              placeholder="Например: Спринт 24 или Q3"
            >
          </div>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn-secondary"
            onclick="closeTaskForm()"
          >
            Отмена
          </button>
          <button
            type="button"
            class="btn-primary"
            onclick="saveTask()"
          >
            Сохранить
          </button>
        </div>
    </div>

  </div>


  <!-- ========================================================
       Pocket Jira JavaScript

       Версия нужна для принудительного обновления файла
       в Telegram WebView после нового deployment.
       ======================================================== -->

  <script src="./script.js?v=20260817-4"></script>

</body>
</html>
